<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Stock Hospitalario</title>
    <script>
      // Storage polyfill for offline / file:// protocol compatibility
      (function() {
        function createMockStorage() {
          var store = {};
          return {
            getItem: function(key) { return key in store ? store[key] : null; },
            setItem: function(key, value) { store[key] = String(value); },
            removeItem: function(key) { delete store[key]; },
            clear: function() { store = {}; },
            key: function(index) { return Object.keys(store)[index] || null; },
            get length() { return Object.keys(store).length; }
          };
        }

        try {
          var test = window.localStorage;
          if (!test) throw new Error();
          test.setItem('__test__', '1');
          test.removeItem('__test__');
        } catch (e) {
          try {
            Object.defineProperty(window, 'localStorage', {
              value: createMockStorage(),
              configurable: true,
              writable: true
            });
          } catch (err) {}
        }

        try {
          var testSession = window.sessionStorage;
          if (!testSession) throw new Error();
          testSession.setItem('__test__', '1');
          testSession.removeItem('__test__');
        } catch (e) {
          try {
            Object.defineProperty(window, 'sessionStorage', {
              value: createMockStorage(),
              configurable: true,
              writable: true
            });
          } catch (err) {}
        }

        // Clean obsolete service worker caches
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if (typeof window !== 'undefined' && 'caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
